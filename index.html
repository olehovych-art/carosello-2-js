<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./assets/styles/style.css">
</head>

<body">
    <div class="container">
        <div class="row">
            <div class="col-12 mt-4">
                <h1 class="text-center mb-4">Best Places to Visit <br> on Lake Garda</h1>

                <!--box principale -->
                <div class="row border rounded overflow-hidden">

                    <!-- Main Img a sinistra -->
                    <div class="main-img col-md-10 p-0 position-relative">
                        <img id="main-image" src="https://picsum.photos/id/1015/1000/600" alt="Lake Garda"
                            class="img-fluid w-100 h-100 object-fit-cover">

                        <!-- Testo sovrapposto sul immagine principale -->
                        <div class="carousel-caption position-absolute bottom-0 start-0 p-3 text-white">
                            <h2 id="slide-title">1. Sirmione</h2>
                            <p id="slide-description">La perla del lago...</p>
                        </div>
                    </div>

                    <!-- Preview Img a destra -->
                    <div class="preview-img col-md-2 p-0 d-flex flex-column position-relative">
                        <button id="prev-btn"
                            class="btn btn-dark nav-btn prev-btn position-absolute top-0 start-50 translate-middle-x mt-2 z-3"
                            aria-label="Precedente">
                            <i class="bi bi-chevron-up"></i>
                        </button>

                        <div id="thumbnails-container"
                            class="preview-img-container d-flex flex-column overflow-hidden h-100">
                            <!-- <img src="https://picsum.photos/id/1015/1000/600" alt="Sirmione"
                                class="img-fluid flex-fill object-fit-cover">
                            <img src="https://picsum.photos/id/1018/1000/600" alt="Riva del Garda"
                                class="img-fluid flex-fill object-fit-cover">
                            <img src="https://picsum.photos/id/1019/1000/600" alt="Malcesine"
                                class="img-fluid flex-fill object-fit-cover">
                            <img src="https://picsum.photos/id/1043/1000/600" alt="Limone"
                                class="img-fluid flex-fill object-fit-cover">
                            <img src="https://picsum.photos/id/1039/1000/600" alt="Lazise"
                                class="img-fluid flex-fill object-fit-cover"> -->
                        </div>
                        <button id="next-btn"
                            class="btn btn-dark nav-btn next-btn position-absolute bottom-0 start-50 translate-middle-x mb-2 z-3"
                            aria-label="Successivo">
                            <i class="bi bi-chevron-down"></i>
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="./assets/script/main.js"></script>
    </body>

</html>
